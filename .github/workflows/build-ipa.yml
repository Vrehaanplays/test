name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Tooling
        run: brew install xcodegen cmake

      - name: Cache llama.xcframework
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Packages/LLMEngineLlama/Vendor/llama.xcframework
          key: llama-xcframework-${{ hashFiles('scripts/build-llama-xcframework.sh') }}

      - name: Build llama.xcframework
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-llama-xcframework.sh

      - name: Signing config (placeholder, unsigned build)
        run: cp Signing.xcconfig.example Signing.xcconfig

      - name: Generate project
        run: xcodegen generate

      - name: Archive (no code signing)
        run: |
          xcodebuild archive \
            -project mobileLLM.xcodeproj \
            -scheme mobileLLM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/mobileLLM.xcarchive \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/mobileLLM.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qry mobileLLM-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: mobileLLM-unsigned-ipa
          path: build/mobileLLM-unsigned.ipa
